name: Static validation

on:
  push:
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Manifest V3 and JavaScript syntax
        run: python tests/test_static.py
      - name: Compile Python scripts
        run: python -m compileall -q companion tests
